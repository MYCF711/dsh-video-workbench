# dsh-artcraft-tab bundle patch
#
# 装法：
#   dsh plugin --profile comfy-test add dsh-artcraft-tab
#
# ★ 格式必须与 dsh-editor 一致：顶层是 insert 列表。
#   第一版我写成平铺的 `- id: ... / name: ...`，
#   结果插件完全没被加载（启动日志里连 artcraft 字样都没有）。
#   对照 dsh-editor/cordis.patch.yml 才发现差了这一层。
#
# 本插件没有 host 侧能力 —— 纯客户端 UI 挂载。
# 它注册 conversation.view 里的一个新 tab（id: artcraft, order 30），
# 排在「视频工作台」(order 20) 之后。
- insert:
    - id: dsh-artcraft-tab
      name: 'dsh-artcraft-tab'
